databases:
  - name: dinopedia-db
    plan: free
    postgresMajorVersion: "16"
    databaseName: dinopedia
    user: dinopedia

services:
  - type: web
    name: dinopedia
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build && npm install --prefix backend
    startCommand: node backend/app.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dinopedia-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"
