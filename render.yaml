services:
  - type: web
    name: dinopedia
    runtime: node
    plan: free
    buildCommand: NODE_ENV=development npm install && npm run build && npm install --prefix backend
    startCommand: node backend/app.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "18.20.8"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: GMAIL_EMAIL
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
